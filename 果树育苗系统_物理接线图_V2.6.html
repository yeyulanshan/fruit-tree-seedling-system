<style>
/* === 主题变量 === */
:root {
  --bg-grad-1: #0a0f1e;
  --bg-grad-2: #0f172a;
  --bg-grad-3: #0a0f1e;
  --page-bg: #0a0f1e;
  --grid-color: #1e293b;
  --grid-opacity: 0.4;
  --border-color: #1e3a5f;
  --module-fill: #16213e;
  --mcu-fill: #1e3a5f;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --title-color: #93c5fd;
  --container-bg: rgba(15, 23, 42, 0.5);
  --container-border: rgba(59, 130, 246, 0.2);
  --legend-bg: rgba(22, 33, 62, 0.8);
  --legend-border: rgba(59, 130, 246, 0.15);
  --pin-stroke: #0f0f1a;
  --accent: #2e9e6b;
  --accent-light: #4ade80;
  --glow: rgba(46, 158, 107, 0.4);
}

/* 浅色主题 */
body.theme-light {
  --bg-grad-1: #f8fafc;
  --bg-grad-2: #f1f5f9;
  --bg-grad-3: #f8fafc;
  --page-bg: #f1f5f9;
  --grid-color: #cbd5e1;
  --grid-opacity: 0.3;
  --border-color: #94a3b8;
  --module-fill: #ffffff;
  --mcu-fill: #dbeafe;
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --title-color: #1e40af;
  --container-bg: rgba(255, 255, 255, 0.8);
  --container-border: rgba(59, 130, 246, 0.3);
  --legend-bg: rgba(255, 255, 255, 0.9);
  --legend-border: rgba(59, 130, 246, 0.2);
  --pin-stroke: #ffffff;
  --accent: #1a7a4c;
  --accent-light: #15803d;
  --glow: rgba(26, 122, 76, 0.2);
}

/* 护眼绿主题 */
body.theme-green {
  --bg-grad-1: #f0fdf4;
  --bg-grad-2: #dcfce7;
  --bg-grad-3: #f0fdf4;
  --page-bg: #dcfce7;
  --grid-color: #86efac;
  --grid-opacity: 0.25;
  --border-color: #22c55e;
  --module-fill: #ffffff;
  --mcu-fill: #d1fae5;
  --text-primary: #14532d;
  --text-secondary: #166534;
  --text-muted: #4ade80;
  --title-color: #15803d;
  --container-bg: rgba(255, 255, 255, 0.7);
  --container-border: rgba(34, 197, 94, 0.3);
  --legend-bg: rgba(255, 255, 255, 0.9);
  --legend-border: rgba(34, 197, 94, 0.2);
  --pin-stroke: #ffffff;
  --accent: #15803d;
  --accent-light: #22c55e;
  --glow: rgba(34, 197, 94, 0.3);
}

/* 深蓝主题 */
body.theme-blue {
  --bg-grad-1: #0c1929;
  --bg-grad-2: #162d4a;
  --bg-grad-3: #0c1929;
  --page-bg: #0c1929;
  --grid-color: #1e3a5f;
  --grid-opacity: 0.5;
  --border-color: #2563eb;
  --module-fill: #132743;
  --mcu-fill: #1e40af;
  --text-primary: #dbeafe;
  --text-secondary: #93c5fd;
  --text-muted: #60a5fa;
  --title-color: #60a5fa;
  --container-bg: rgba(12, 25, 41, 0.6);
  --container-border: rgba(37, 99, 235, 0.3);
  --legend-bg: rgba(19, 39, 67, 0.9);
  --legend-border: rgba(37, 99, 235, 0.2);
  --pin-stroke: #0c1929;
  --accent: #3b82f6;
  --accent-light: #60a5fa;
  --glow: rgba(59, 130, 246, 0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  min-height: 100vh;
  padding: 24px;
  transition: background 0.4s ease;
  position: relative;
  overflow-x: hidden;
}
/* 背景装饰光晕 */
body::before {
  content: '';
  position: fixed;
  top: -20%; left: -10%;
  width: 500px; height: 500px;
  background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -20%; right: -10%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}

/* 顶部标题栏 - 玻璃拟态 */
.header-bar {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto 20px;
  padding: 24px 32px;
  background: var(--container-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 16px;
  border: 1px solid var(--container-border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header-icon {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  box-shadow: 0 4px 20px var(--glow);
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 4px 20px var(--glow); }
  50% { box-shadow: 0 4px 30px var(--glow), 0 0 40px var(--glow); }
}
.header-text h1 {
  color: var(--title-color);
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: 1px;
}
.header-text .sub {
  color: var(--text-muted);
  font-size: 12px;
  font-family: Consolas, monospace;
}
.header-stats { display: flex; gap: 24px; }
.stat-item { text-align: center; }
.stat-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent-light);
  line-height: 1;
}
.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* 主题切换按钮 - 玻璃拟态 */
.theme-switcher {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
}
.theme-btn {
  padding: 8px 18px;
  border: 1px solid var(--container-border);
  border-radius: 20px;
  background: var(--container-bg);
  backdrop-filter: blur(8px);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 13px;
  font-family: "Microsoft YaHei", sans-serif;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}
.theme-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px var(--glow);
  border-color: var(--accent);
}
.theme-btn.active {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff;
  box-shadow: 0 4px 16px var(--glow);
}
.theme-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }

.tip-wrap { text-align: center; margin-bottom: 16px; position: relative; z-index: 1; }
.tip {
  color: var(--accent-light);
  font-size: 13px;
  background: var(--container-bg);
  backdrop-filter: blur(8px);
  padding: 8px 24px;
  border-radius: 20px;
  display: inline-block;
  border: 1px solid var(--container-border);
}

/* 主容器 - 玻璃拟态 */
.container {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  overflow: auto;
  background: var(--container-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 16px;
  padding: 16px;
  border: 1px solid var(--container-border);
  box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  max-width: 1400px;
  margin: 0 auto;
}
svg { max-width: 100%; height: auto; }

/* SVG内部样式 */
.grid-line { stroke: var(--grid-color); stroke-width: 0.3; opacity: var(--grid-opacity); }
.svg-border { stroke: var(--border-color); stroke-width: 1; opacity: 0.5; }
.svg-title { fill: var(--title-color); font-size: 20px; font-weight: bold; text-anchor: middle; font-family: "Microsoft YaHei"; }
.svg-subtitle { fill: var(--text-muted); font-size: 11px; text-anchor: middle; font-family: Consolas; }
.svg-footer { fill: var(--text-muted); font-size: 10px; text-anchor: middle; font-family: Consolas; }
.module-box, .module-box-static { fill: var(--module-fill); }
.mcu-box {
  fill: var(--mcu-fill);
  stroke: var(--accent);
  stroke-width: 2;
  filter: drop-shadow(0 0 8px var(--glow));
}
.mcu-title { fill: var(--title-color); font-size: 14px; font-weight: bold; text-anchor: middle; font-family: Consolas; }
.mcu-sub { fill: var(--text-muted); font-size: 9px; text-anchor: middle; font-family: Consolas; }
.mod-title { fill: var(--text-primary); font-size: 10px; font-weight: bold; text-anchor: middle; }
.mod-sub { fill: var(--text-secondary); font-size: 8px; text-anchor: middle; font-family: Consolas; }
.mod-divider { stroke: #2d3a5c; stroke-width: 0.5; }
.mod-pin-label { fill: var(--text-primary); font-size: 8.5px; font-family: Consolas; }
.mod-pin-name { fill: var(--text-secondary); font-size: 8.5px; text-anchor: end; font-family: Consolas; }
.pin-name-left { font-size: 8.5px; text-anchor: end; font-family: Consolas; }
.pin-name-right { font-size: 8.5px; text-anchor: start; font-family: Consolas; }
.pin-sig { fill: var(--text-secondary); font-size: 7.5px; font-family: Consolas; }
.pin-sig-right { fill: var(--text-secondary); font-size: 7.5px; text-anchor: end; font-family: Consolas; }

/* 图例 - 玻璃拟态 */
.legend {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 16px auto;
  padding: 14px 24px;
  background: var(--legend-bg);
  backdrop-filter: blur(12px);
  border-radius: 12px;
  max-width: 1000px;
  border: 1px solid var(--legend-border);
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-primary);
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 8px;
  transition: background 0.2s;
}
.legend-item:hover { background: rgba(255,255,255,0.05); }
.legend-color { width: 24px; height: 4px; border-radius: 2px; }

.module { cursor: pointer; }
.module-box { transition: all 0.25s ease; }
.module:hover .module-box {
  stroke-width: 3;
  filter: brightness(1.15) drop-shadow(0 0 6px var(--glow));
}
.wire { transition: opacity 0.2s ease, stroke-width 0.2s ease; }
.wire:hover { stroke-width: 3 !important; opacity: 1 !important; cursor: pointer; }
svg.highlight-mode .wire { opacity: 0.12; }
svg.highlight-mode .wire.active { opacity: 1; stroke-width: 3; }
svg.highlight-mode .module.dim .module-box { opacity: 0.35; }
svg.highlight-mode .module.active .module-box { stroke-width: 3; filter: brightness(1.15); }

#tooltip {
  position: fixed;
  background: rgba(15, 23, 42, 0.97);
  color: #e2e8f0;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-family: Consolas, "Microsoft YaHei", monospace;
  pointer-events: none;
  z-index: 1000;
  border: 1px solid var(--accent);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px var(--glow);
  display: none;
  max-width: 320px;
  backdrop-filter: blur(10px);
}
#tooltip .tt-title { color: var(--accent-light); font-weight: bold; margin-bottom: 6px; font-size: 14px; }
#tooltip .tt-line { color: #cbd5e1; margin: 3px 0; }
#tooltip .tt-pin { color: #fbbf24; }

/* 底部信息栏 */
.footer-bar {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 16px auto 0;
  padding: 12px 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: 12px;
  font-family: Consolas, monospace;
}

@media (max-width: 768px) {
  .header-bar { flex-direction: column; text-align: center; }
  .header-stats { gap: 16px; }
  .stat-num { font-size: 18px; }
}
</style>
</head>

<div class="footer-bar">果树种子育苗系统 · 硬件接线图 V2.6 · 基于 STM32F103ZET6 正点原子精英V2开发板</div>

<div id="tooltip"></div>

<script>
// 主题切换
document.querySelectorAll('.theme-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var theme = this.getAttribute('data-theme');
    document.body.className = 'theme-' + theme;
    document.querySelectorAll('.theme-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
  });
});

// 交互高亮
(function() {
  const svg = document.getElementById('wiring-svg');
  const tooltip = document.getElementById('tooltip');
  const modules = svg.querySelectorAll('.module');
  const wires = svg.querySelectorAll('.wire');

  modules.forEach(function(mod) {
    mod.addEventListener('mouseenter', function() {
      const modId = this.getAttribute('data-module');
      svg.classList.add('highlight-mode');
      svg.querySelectorAll('.wire-' + modId).forEach(function(w) { w.classList.add('active'); });
      this.classList.add('active');
      modules.forEach(function(m) { if (m !== mod) m.classList.add('dim'); });
    });
    mod.addEventListener('mouseleave', function() {
      svg.classList.remove('highlight-mode');
      svg.querySelectorAll('.wire.active').forEach(function(w) { w.classList.remove('active'); });
      modules.forEach(function(m) { m.classList.remove('active'); m.classList.remove('dim'); });
    });
  });

  wires.forEach(function(wire) {
    wire.addEventListener('mouseenter', function(e) {
      const from = this.getAttribute('data-from');
      const to = this.getAttribute('data-to');
      tooltip.style.display = 'block';
      tooltip.innerHTML = '<div class="tt-title">连接详情</div>' +
        '<div class="tt-line"><span class="tt-pin">' + from + '</span></div>' +
        '<div class="tt-line" style="text-align:center;color:#64748b;">\u2193</div>' +
        '<div class="tt-line"><span class="tt-pin">' + to + '</span></div>';
      moveTooltip(e);
      this.style.strokeWidth = '3';
      this.style.opacity = '1';
    });
    wire.addEventListener('mousemove', moveTooltip);
    wire.addEventListener('mouseleave', function() {
      tooltip.style.display = 'none';
      this.style.strokeWidth = '';
      this.style.opacity = '';
    });
  });

  function moveTooltip(e) {
    tooltip.style.left = (e.clientX + 15) + 'px';
    tooltip.style.top = (e.clientY + 15) + 'px';
  }
})();
</script>
